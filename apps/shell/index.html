<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReactDemos Shell</title>
    <style>
      :root {
        --header-height: 56px;
        --divider-color: #d9d9d9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .shell {
        height: 100vh;
        display: grid;
        grid-template-rows: var(--header-height) 1fr;
      }

      .topbar {
        background: #1a1a1a;
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 16px;
        font-size: 16px;
        font-weight: 600;
      }

      .panes {
        display: grid;
        grid-template-columns: 1fr 1px 1fr;
        min-height: 0;
      }

      .divider {
        background: var(--divider-color);
      }

      .pane {
        min-height: 0;
        display: grid;
        grid-template-rows: 40px 1fr;
      }

      .pane-label {
        margin: 0;
        padding: 0 12px;
        background: #1a1a1a;
        color: #fff;
        display: flex;
        align-items: center;
        font-size: 14px;
        font-weight: 600;
      }

      .pane-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">ReactDemos — v16 vs v19</header>
      <main class="panes">
        <section class="pane">
          <h2 class="pane-label">React 16</h2>
          <iframe class="pane-frame" src="http://localhost:5174" title="React 16"></iframe>
        </section>
        <div class="divider" aria-hidden="true"></div>
        <section class="pane">
          <h2 class="pane-label">React 19</h2>
          <iframe class="pane-frame" src="http://localhost:5173" title="React 19"></iframe>
        </section>
      </main>
    </div>
  </body>
</html>
