name: Deploy ReactDemos

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  # ── Build jobs ────────────────────────────────────────────────────────────
  # Run on every PR and every push so CI validates the build before merge.
  # The Vercel prebuilt output is uploaded as an artifact so the deploy jobs
  # can reuse it without rebuilding.

  build-v19:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_V19 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20 with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack and pnpm 10
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output-v19
          path: .vercel/output
          retention-days: 1

  build-v16:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_V16 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20 with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack and pnpm 10
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output-v16
          path: .vercel/output
          retention-days: 1

  # ── Deploy jobs ───────────────────────────────────────────────────────────
  # Push to development only. Download the prebuilt artifact from the build
  # job — no rebuild, just upload to Vercel.

  deploy-v19:
    needs: build-v19
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_V19 }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-output-v19
          path: .vercel/output

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy prebuilt artifacts
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  deploy-v16:
    needs: build-v16
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_V16 }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-output-v16
          path: .vercel/output

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy prebuilt artifacts
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # ── Notify ────────────────────────────────────────────────────────────────

  notify:
    if: github.event_name == 'push' && always()
    runs-on: ubuntu-latest
    needs: [deploy-v19, deploy-v16]
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          V19_RESULT: ${{ needs.deploy-v19.result }}
          V16_RESULT: ${{ needs.deploy-v16.result }}
          V19_URL: ${{ needs.deploy-v19.outputs.url }}
          V16_URL: ${{ needs.deploy-v16.outputs.url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$V19_RESULT" = "success" ] && [ "$V16_RESULT" = "success" ]; then
            TEXT=$(printf "✅ <b>ReactDemos deployed</b>\n\n📦 Branch: <code>development</code>\n🔗 Commit: <code>%s</code>\n\n🟢 React 19: %s\n🟢 React 16: %s" \
              "$SHORT_SHA" "$V19_URL" "$V16_URL")
          else
            TEXT=$(printf "❌ <b>ReactDemos deploy FAILED</b>\n\n📦 Branch: <code>development</code>\n🔗 Commit: <code>%s</code>\n\nCheck logs: %s" \
              "$SHORT_SHA" "$RUN_URL")
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}"

  # ── Changelog PR comment ──────────────────────────────────────────────────

  changelog-comment:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract unreleased changelog
        id: changelog
        run: |
          CONTENT=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## /{exit} found && /[^[:space:]]/{print}' CHANGELOG.md)
          if [ -z "$CONTENT" ]; then
            CONTENT="_No unreleased changes documented yet._"
          fi
          {
            echo "content<<EOF"
            echo "$CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing changelog comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- changelog-comment -->"

      - name: Post or update changelog PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- changelog-comment -->
            ## What changed in this PR

            ${{ steps.changelog.outputs.content }}
